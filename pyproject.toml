[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-automation-agent"
version = "0.1.0"
description = "A Playwright-based browser automation agent with a FastAPI control API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright==1.63.0",
    "python-dotenv",
    "google-genai",
    "pydantic",
    "fastapi",
    "uvicorn[standard]",
    "google-cloud-firestore",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
