name: Python syntax and device-history tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/device-scoped-history]

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API test dependencies
        run: python -m pip install fastapi pydantic python-dotenv
      - name: Compile Python sources
        run: python -m py_compile api_server.py agent.py main.py
      - name: Test device ownership and local history deletion
        run: python -m unittest discover -s tests -v
