name: Python syntax validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/device-scoped-history]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m py_compile api_server.py agent.py main.py
