<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="100%">

<defs>
  <style>
    .bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
    .zone { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5,4; rx: 8; }
    .zone-sec { fill: #fef2f2; stroke: #f87171; stroke-width: 1.5; stroke-dasharray: 5,4; rx: 8; }
    .zone-green { fill: #f0fdf4; stroke: #4ade80; stroke-width: 1.5; stroke-dasharray: 5,4; rx: 8; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; rx: 6; }
    .box-primary { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.8; rx: 6; }
    .box-accent { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; rx: 6; }
    .box-warn { fill: #fffbeb; stroke: #d97706; stroke-width: 1.8; rx: 6; }
    .box-danger { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.8; rx: 6; }
    .box-purple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.8; rx: 6; }
    .box-dark { fill: #0f172a; stroke: #1e293b; stroke-width: 1.8; rx: 6; }
    .title { font-family: 'Inter', 'Segoe UI', 'DejaVu Sans', sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
    .zone-title { font-family: 'Inter', 'Segoe UI', 'DejaVu Sans', sans-serif; font-size: 11px; font-weight: 700; fill: #475569; text-transform: uppercase; letter-spacing: 0.5px; }
    .node-title { font-family: 'Inter', 'Segoe UI', 'DejaVu Sans', sans-serif; font-size: 11.5px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .node-title-light { font-family: 'Inter', 'Segoe UI', 'DejaVu Sans', sans-serif; font-size: 11.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .node-sub { font-family: 'Inter', 'Segoe UI', 'DejaVu Sans', sans-serif; font-size: 9.5px; font-weight: 400; fill: #475569; text-anchor: middle; }
    .node-sub-light { font-family: 'Inter', 'Segoe UI', 'DejaVu Sans', sans-serif; font-size: 9.5px; font-weight: 400; fill: #cbd5e1; text-anchor: middle; }
    .edge-label { font-family: 'Inter', 'Segoe UI', 'DejaVu Sans', sans-serif; font-size: 9px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
    .arrow { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .arrow-blue { stroke: #2563eb; stroke-width: 1.8; fill: none; marker-end: url(#arrow-blue); }
    .arrow-green { stroke: #059669; stroke-width: 1.8; fill: none; marker-end: url(#arrow-green); }
    .arrow-red { stroke: #dc2626; stroke-width: 1.6; stroke-dasharray: 4,3; fill: none; marker-end: url(#arrow-red); }
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
  </marker>
</defs>

<rect class="bg" x="2" y="2" width="816" height="246"/>

  <text class="title" x="20" y="26">Скінченний автомат станів виконання та фаз прогресу (State Machine)</text>
  <rect class="box-primary" x="20" y="52" width="110" height="44"/><text class="node-title" x="75" y="72">STARTING</text><text class="node-sub" x="75" y="86">Ініціалізація</text>
  <rect class="box-primary" x="150" y="52" width="115" height="44"/><text class="node-title" x="207" y="72">OPENING_URL</text><text class="node-sub" x="207" y="86">Перехід на URL</text>
  <rect class="box-primary" x="285" y="52" width="135" height="44"/><text class="node-title" x="352" y="72">PREPARING_PROFILE</text><text class="node-sub" x="352" y="86">Прізвище / Група</text>
  <rect class="box-primary" x="440" y="52" width="145" height="44"/><text class="node-title" x="512" y="72">ANALYZING_QUESTIONS</text><text class="node-sub" x="512" y="86">Екстракція + Gemini</text>
  <rect class="box-primary" x="605" y="52" width="135" height="44"/><text class="node-title" x="672" y="72">SELECTING_ANSWERS</text><text class="node-sub" x="672" y="86">Кліки в браузері</text>

  <line class="arrow-blue" x1="130" y1="74" x2="150" y2="74"/>
  <line class="arrow-blue" x1="265" y1="74" x2="285" y2="74"/>
  <line class="arrow-blue" x1="420" y1="74" x2="440" y2="74"/>
  <line class="arrow-blue" x1="585" y1="74" x2="605" y2="74"/>

  <rect class="box-accent" x="605" y="122" width="135" height="44"/><text class="node-title" x="672" y="142">SUBMITTING</text><text class="node-sub" x="672" y="156">Надсилання форми</text>
  <line class="arrow-green" x1="672" y1="96" x2="672" y2="122"/>
  <!-- Loop for multi-page -->
  <path class="arrow-blue" d="M 605 144 L 512 144 L 512 96"/>
  <text class="edge-label" x="558" y="138">Наступна стор.</text>

  <!-- Terminal States -->
  <rect class="box-accent" x="20" y="185" width="140" height="48"/><text class="node-title" x="90" y="206">COMPLETED</text><text class="node-sub" x="90" y="221">Бал підтверджено</text>
  <rect class="box-warn" x="175" y="185" width="150" height="48"/><text class="node-title" x="250" y="206">NEEDS_MANUAL_INPUT</text><text class="node-sub" x="250" y="221">Потрібна дія користувача</text>
  <rect class="box-danger" x="340" y="185" width="145" height="48"/><text class="node-title" x="412" y="206">BLOCKED_ACCESS</text><text class="node-sub" x="412" y="221">Login / CAPTCHA</text>
  <rect class="box-danger" x="500" y="185" width="155" height="48"/><text class="node-title" x="577" y="206">SUBSCRIPTION_REQ</text><text class="node-sub" x="577" y="221">Платний доступ / Тариф</text>
  <rect class="box-danger" x="670" y="185" width="130" height="48"/><text class="node-title" x="735" y="206">FAILED / TIMEOUT</text><text class="node-sub" x="735" y="221">Ліміт 300с / 360с</text>

  <line class="arrow-green" x1="605" y1="158" x2="90" y2="185"/>
  <line class="arrow-red" x1="207" y1="96" x2="412" y2="185"/>
  <line class="arrow-red" x1="207" y1="96" x2="577" y2="185"/>

</svg>