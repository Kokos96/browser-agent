name: Validate Python project

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all Python sources and tests
        run: python -m compileall -q api_server.py main.py public_url_security.py src/browser_agent tests
      - name: Install Playwright Chromium for browser E2E tests
        run: python -m playwright install --with-deps chromium
      - name: Run unit and browser integration tests
        run: python -m unittest discover -s tests -v
