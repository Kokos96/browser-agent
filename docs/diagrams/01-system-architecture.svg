<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="100%">

<defs>
  <style>
    .bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
    .zone { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5,4; rx: 8; }
    .zone-sec { fill: #fef2f2; stroke: #f87171; stroke-width: 1.5; stroke-dasharray: 5,4; rx: 8; }
    .zone-green { fill: #f0fdf4; stroke: #4ade80; stroke-width: 1.5; stroke-dasharray: 5,4; rx: 8; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; rx: 6; }
    .box-primary { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.8; rx: 6; }
    .box-accent { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; rx: 6; }
    .box-warn { fill: #fffbeb; stroke: #d97706; stroke-width: 1.8; rx: 6; }
    .box-danger { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.8; rx: 6; }
    .box-purple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.8; rx: 6; }
    .box-dark { fill: #0f172a; stroke: #1e293b; stroke-width: 1.8; rx: 6; }
    .title { font-family: 'Inter', 'Segoe UI', 'DejaVu Sans', sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
    .zone-title { font-family: 'Inter', 'Segoe UI', 'DejaVu Sans', sans-serif; font-size: 11px; font-weight: 700; fill: #475569; text-transform: uppercase; letter-spacing: 0.5px; }
    .node-title { font-family: 'Inter', 'Segoe UI', 'DejaVu Sans', sans-serif; font-size: 11.5px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .node-title-light { font-family: 'Inter', 'Segoe UI', 'DejaVu Sans', sans-serif; font-size: 11.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .node-sub { font-family: 'Inter', 'Segoe UI', 'DejaVu Sans', sans-serif; font-size: 9.5px; font-weight: 400; fill: #475569; text-anchor: middle; }
    .node-sub-light { font-family: 'Inter', 'Segoe UI', 'DejaVu Sans', sans-serif; font-size: 9.5px; font-weight: 400; fill: #cbd5e1; text-anchor: middle; }
    .edge-label { font-family: 'Inter', 'Segoe UI', 'DejaVu Sans', sans-serif; font-size: 9px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
    .arrow { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .arrow-blue { stroke: #2563eb; stroke-width: 1.8; fill: none; marker-end: url(#arrow-blue); }
    .arrow-green { stroke: #059669; stroke-width: 1.8; fill: none; marker-end: url(#arrow-green); }
    .arrow-red { stroke: #dc2626; stroke-width: 1.6; stroke-dasharray: 4,3; fill: none; marker-end: url(#arrow-red); }
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
  </marker>
</defs>

<rect class="bg" x="2" y="2" width="816" height="286"/>

  <text class="title" x="20" y="26">Високорівнева системна архітектура Browser Automation Agent</text>
  <!-- Client Zone -->
  <rect class="zone" x="18" y="42" width="180" height="230"/>
  <text class="zone-title" x="28" y="60">Клієнтський рівень (Vercel)</text>
  <rect class="box-primary" x="32" y="75" width="152" height="58"/>
  <text class="node-title" x="108" y="98">Web SPA Frontend</text>
  <text class="node-sub" x="108" y="114">HTML5 / CSS3 / Vanilla JS</text>
  <text class="node-sub" x="108" y="126">Mobile-First + 3D Tilt UI</text>
  <rect class="box" x="32" y="150" width="152" height="48"/>
  <text class="node-title" x="108" y="170">LocalStorage Engine</text>
  <text class="node-sub" x="108" y="185">X-Client-Id, Профіль, Токен</text>
  <rect class="box-accent" x="32" y="212" width="152" height="46"/>
  <text class="node-title" x="108" y="232">Тестові стенди</text>
  <text class="node-sub" x="108" y="247">test-quiz.html / agent-test.html</text>

  <!-- Backend Zone -->
  <rect class="zone" x="235" y="42" width="355" height="230"/>
  <text class="zone-title" x="247" y="60">Серверний рівень (Google Cloud Run · europe-west1)</text>
  <rect class="box-primary" x="250" y="75" width="155" height="58"/>
  <text class="node-title" x="327" y="96">FastAPI API Gateway</text>
  <text class="node-sub" x="327" y="111">api_server.py (REST + Auth)</text>
  <text class="node-sub" x="327" y="124">public_url_security.py (SSRF)</text>

  <rect class="box-purple" x="420" y="75" width="155" height="58"/>
  <text class="node-title" x="497" y="96">Multi-Agent Core</text>
  <text class="node-sub" x="497" y="111">QuizOrchestrator + 6 агентів</text>
  <text class="node-sub" x="497" y="124">Асинхронний Subprocess</text>

  <rect class="box" x="250" y="152" width="155" height="52"/>
  <text class="node-title" x="327" y="173">Сховище станів і логів</text>
  <text class="node-sub" x="327" y="188">results/history.json (Atomic)</text>
  <text class="node-sub" x="327" y="199">results/run_&lt;id&gt;.log</text>

  <rect class="box-accent" x="420" y="152" width="155" height="52"/>
  <text class="node-title" x="497" y="173">Playwright Chromium</text>
  <text class="node-sub" x="497" y="188">Headless Browser Engine</text>
  <text class="node-sub" x="497" y="199">DOM Snapshot + Auto-Click</text>

  <rect class="box-warn" x="250" y="216" width="325" height="42"/>
  <text class="node-title" x="412" y="235">Lifecycle &amp; Stale-Run Watchdog</text>
  <text class="node-sub" x="412" y="249">MAX_RUN_DURATION = 300s · STALE_TIMEOUT = 360s · Non-throttled CPU</text>

  <!-- External Zone -->
  <rect class="zone" x="625" y="42" width="177" height="230"/>
  <text class="zone-title" x="635" y="60">Зовнішні сервіси</text>
  <rect class="box-purple" x="638" y="82" width="150" height="68"/>
  <text class="node-title" x="713" y="106">Google Gemini API</text>
  <text class="node-sub" x="713" y="122">google-genai SDK</text>
  <text class="node-sub" x="713" y="136">2.5 Flash-Lite / Flash / Pro</text>

  <rect class="box-accent" x="638" y="175" width="150" height="68"/>
  <text class="node-title" x="713" y="199">Цільові веб-платформи</text>
  <text class="node-sub" x="713" y="215">Зовнішні HTTPS-тести,</text>
  <text class="node-sub" x="713" y="229">Google Forms, LMS, Квізи</text>

  <!-- Arrows -->
  <line class="arrow-blue" x1="184" y1="104" x2="250" y2="104"/>
  <text class="edge-label" x="217" y="97">HTTPS / JSON</text>
  <line class="arrow" x1="405" y1="104" x2="420" y2="104"/>
  <line class="arrow" x1="327" y1="133" x2="327" y2="152"/>
  <line class="arrow" x1="497" y1="133" x2="497" y2="152"/>
  <line class="arrow-blue" x1="575" y1="104" x2="638" y2="112"/>
  <text class="edge-label" x="606" y="98">gRPC/REST</text>
  <line class="arrow-green" x1="575" y1="178" x2="638" y2="205"/>
  <text class="edge-label" x="606" y="182">HTTPS DOM</text>

</svg>